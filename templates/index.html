<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatPLVis</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .modal { display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.4); }
    .modal-content { background:#fefefe; margin:15% auto; padding:20px; border:1px solid #888; width:80%; max-width:600px; border-radius:8px; position:relative; }
    .modal .close { color:#aaa; float:right; font-size:28px; font-weight:bold; cursor:pointer; position:absolute; top:10px; right:15px; }
    .modal .close:hover, .modal .close:focus { color:black; }
    .info-message{color:#17a2b8;margin-bottom:10px;}
    .success-message{color:#28a745;margin-bottom:10px;}
    .warning-message{color:#ffc107;margin-bottom:10px;}
    .error-message{color:#dc3545;margin-bottom:10px;}
  </style>
</head>
<body>
  <!-- Header -->
  <div id="header">
    <center><h1>ChatPLVis</h1></center>
    <button id="dark-mode-toggle">Dark Mode</button>
  </div>

  <!-- Flash modal -->
  <div id="flash-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modal-messages"></div>
    </div>
  </div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div id="loading-content">
      <div class="spinner"></div>
      <p>Loading Graph... Please wait.</p>
    </div>
  </div>

  <div id="main-container">
    <!-- Left Panel -->
    <div id="left-panel">
      <!-- Chatbot -->
      <div id="chatbot">
        <h3>Chatbot</h3>
        <label class="toggle-container">
          <input type="checkbox" id="include-similar">
          <span class="slider"></span> Include Top 5 Similar Proteins
        </label>
        <div id="chatbot-messages"></div>
        <div id="chatbot-input-container">
          <input type="text" id="chatbot-input" placeholder="Type your message here...">
          <button id="chatbot-send">Send</button>
        </div>
      </div>

      <!-- Selected Proteins -->
      <div id="selected-nodes-list">
        <h3 style="display:flex; justify-content:space-between; align-items:center;">
          Selected Proteins:
          <button id="clear-all-button"
                  style="margin-top:10px; padding:5px 10px; background:#dc3545; border:none; color:#fff;
                         cursor:pointer; border-radius:5px; font-size:0.9em;">
            Clear All
          </button>
        </h3>
        <div id="selected-proteins-container">
          <ul id="selected-proteins"></ul>
        </div>
      </div>

      <!-- Data Management -->
      <div id="controls">
        <h3>Data Management</h3>

        <div class="controls-row">
          <form method="POST" enctype="multipart/form-data" action="{{ url_for('index') }}" style="display:flex; align-items:center; gap:10px;">
            <label>Upload CSV:</label>
            <input type="file" name="file" accept=".csv">
            <button type="submit">Upload</button>
          </form>
        </div>

        <div class="controls-row">
          <form method="POST" style="display:flex; align-items:center; gap:10px;">
            <label for="selected_csv">Or Select CSV:</label>
            <select name="selected_csv" onchange="this.form.submit()">
              {% for label, path in csv_file_choices %}
                <option value="{{ path }}" {% if path == selected_csv %} selected {% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </form>
        </div>

        <div class="controls-row">
          <form method="POST" action="{{ url_for('fetch_function_cc') }}">
            <button type="submit">Fetch/Update Function [CC]</button>
          </form>
          <form method="POST" action="{{ url_for('fetch_abstracts') }}">
            <button type="submit">Fetch/Update Abstracts</button>
          </form>
        </div>
      </div>

      <!-- Plot Settings (simplified: ONLY plot type + info source) -->
      <div id="controls">
        <h3>Plot Settings</h3>
        <form method="POST" id="controls-form">
          <input type="hidden" name="selected_csv" value="{{ selected_csv }}">
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
            <div>
              <label for="plot_type">Plot Type:</label>
              <select name="plot_type" id="plot_type">
                {% for p_option in plot_options %}
                  <option value="{{ p_option }}" {% if p_option == plot_type %}selected{% endif %}>{{ p_option }}</option>
                {% endfor %}
              </select>
            </div>
            <div>
              <label for="info_source">Info Source:</label>
              <select name="info_source" id="info_source">
                {% for i_option in info_options %}
                  <option value="{{ i_option }}" {% if i_option == info_source %}selected{% endif %}>{{ i_option }}</option>
                {% endfor %}
              </select>
            </div>
            <div>
              <button type="submit" style="margin-top:30px;">Update Plot</button>
            </div>
          </div>
        </form>
      </div>

    </div>

    <!-- Graph Container -->
    <div id="graph"></div>
  </div>

  <script>
    // Loading screen on
    document.getElementById('loading-screen').style.display = 'flex';

    // Flash messages => modal
    var flashedMessages = {{ get_flashed_messages(with_categories=true)|tojson }};
    if (flashedMessages.length > 0) {
      let content = '';
      flashedMessages.forEach(function(item) {
        const category = item[0];
        const message = item[1];
        let categoryClass = category + "-message";
        content += `<div class="${categoryClass}">${message}</div>`;
      });
      document.getElementById('modal-messages').innerHTML = content;
      const flashModal = document.getElementById('flash-modal');
      flashModal.style.display = 'block';
      const closeBtn = flashModal.querySelector('.close');
      closeBtn.onclick = function(){ flashModal.style.display = 'none'; };
      window.onclick = function(e){ if (e.target == flashModal) flashModal.style.display = 'none'; };
    }

    const plotType = "{{ plot_type }}";
    const nodes = {{ nodes|tojson }};
    const edges = {{ edges|tojson }};

    var selectedNodeIds = [];
    var graphDiv = document.getElementById('graph');
    var selectedProteinsList = document.getElementById('selected-proteins');
    var clearAllButton = document.getElementById('clear-all-button');

    // Prepare Plotly data
    let data, layout;

    if (plotType.startsWith("3D")) {
      const nodeX = nodes.map(n => n.x);
      const nodeY = nodes.map(n => n.y);
      const nodeZ = nodes.map(n => n.z);
      const labels = nodes.map(n => n.label);
      const ids    = nodes.map(n => n.id);
      const nodeColors = nodes.map(n => n.color);

      // optional edges (none by default)
      const edgeX = [], edgeY = [], edgeZ = [];
      const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));
      for (let e of edges) {
        const s = nodeMap[e.source], t = nodeMap[e.target];
        if (s && t) {
          edgeX.push(s.x, t.x, null);
          edgeY.push(s.y, t.y, null);
          edgeZ.push(s.z, t.z, null);
        }
      }

      data = [
        {
          x: edgeX, y: edgeY, z: edgeZ,
          mode: 'lines', type: 'scatter3d',
          line: { color: 'rgba(150,150,150,0.3)', width: 1 },
          hoverinfo: 'none'
        },
        {
          x: nodeX, y: nodeY, z: nodeZ,
          mode: 'markers', type: 'scatter3d',
          marker: {
            // UNIFORM, SAME SIZE NODES
            size: nodes.length ? nodes[0].size : 10,
            color: nodeColors,
            opacity: 0.85,
            line: { color: '#FFFFFF', width: 0.5 }
          },
          text: labels,
          customdata: ids,
          hoverinfo: 'text',
          hoverlabel: { bgcolor:'#FFFFFF', font:{color:'#000000'} }
        }
      ];

      layout = {
        scene: {
          xaxis: {visible:false}, yaxis: {visible:false}, zaxis: {visible:false},
          bgcolor: '#ffffff', camera: { eye: {x:1.5, y:1.5, z:1.5} }
        },
        paper_bgcolor: '#ffffff',
        margin: { l:0, r:0, b:0, t:0 },
        showlegend: false,
        uirevision: 'true'
      };

    } else {
      const nodeX = nodes.map(n => n.x);
      const nodeY = nodes.map(n => n.y);
      const labels = nodes.map(n => n.label);
      const ids    = nodes.map(n => n.id);
      const nodeColors = nodes.map(n => n.color);

      data = [
        {
          x: nodeX, y: nodeY,
          mode: 'markers', type: 'scattergl',
          marker: {
            // UNIFORM, SAME SIZE NODES
            size: nodes.length ? nodes[0].size : 10,
            color: nodeColors,
            opacity: 0.85,
            line: { color: '#FFFFFF', width: 0.5 }
          },
          text: labels,
          customdata: ids,
          hoverinfo: 'text',
          hoverlabel: { bgcolor:'#FFFFFF', font:{color:'#000000'} }
        }
      ];

      layout = {
        dragmode: 'select',
        xaxis: { visible:false, scaleanchor:'y' },
        yaxis: { visible:false },
        paper_bgcolor: '#ffffff',
        margin: { l:0, r:0, b:0, t:0 },
        showlegend: false,
        uirevision: 'true'
      };
    }

    const config = {
      responsive: true,
      displayModeBar: true,
      scrollZoom: true,
      displaylogo: false,
      modeBarButtonsToRemove: ['toImage','sendDataToCloud']
    };

    Plotly.newPlot('graph', data, layout, config).then(function(){
      document.getElementById('loading-screen').style.display = 'none';
    });

    // Selection list UI
    function updateSelectedProteinsList() {
      selectedProteinsList.innerHTML = '';
      selectedNodeIds.forEach(function(id) {
        const node = nodes.find(n => n.id === id);
        if (node) {
          const li = document.createElement('li');
          li.innerHTML = `${node.protein_name}
            <button class="remove-protein" data-node-id="${id}"
              style="margin-left:10px;background:#dc3545;border:none;color:#fff;border-radius:3px;padding:2px 5px;cursor:pointer;">X</button>`;
          selectedProteinsList.appendChild(li);
        }
      });
    }

    graphDiv.on('plotly_click', function(d){
      var pt = d.points[0];
      if(!pt) return;
      var id = pt.customdata;
      if (selectedNodeIds.includes(id)) {
        selectedNodeIds = selectedNodeIds.filter(x => x !== id);
      } else { selectedNodeIds.push(id); }
      updateSelectedProteinsList();
    });

    graphDiv.on('plotly_selected', function(ev){
      if (!ev) return;
      selectedNodeIds = ev.points.map(p => p.customdata);
      updateSelectedProteinsList();
    });

    document.getElementById('selected-proteins-container').addEventListener('click', function(e){
      if (e.target && e.target.classList.contains('remove-protein')) {
        var id = parseInt(e.target.getAttribute('data-node-id'));
        selectedNodeIds = selectedNodeIds.filter(x => x !== id);
        updateSelectedProteinsList();
      }
    });

    document.getElementById('clear-all-button').addEventListener('click', function(){
      selectedNodeIds = [];
      updateSelectedProteinsList();
    });

    // Chatbot
    var sendButton = document.getElementById('chatbot-send');
    var inputField = document.getElementById('chatbot-input');
    var messagesDiv = document.getElementById('chatbot-messages');

    sendButton.onclick = function(){
      if (selectedNodeIds.length === 0) { alert('Please select at least one node first.'); return; }
      var message = inputField.value.trim();
      if (message === '') { alert('Please enter a message.'); return; }
      var includeSimilar = document.getElementById('include-similar').checked;

      messagesDiv.innerHTML += '<p><strong>You:</strong> ' + message + '</p>';
      inputField.value = '';

      fetch('/chatbot', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ node_ids:selectedNodeIds, message, include_similar:includeSimilar })
      })
      .then(r => r.json())
      .then(data => { messagesDiv.innerHTML += '<p><strong>PLVis:</strong></p>' + data.message; })
      .catch(err => {
        console.error('Error:', err);
        messagesDiv.innerHTML += '<p><strong>PLVis:</strong> An error occurred. Please try again later.</p>';
      });
    };

    // Dark mode
    document.getElementById('dark-mode-toggle').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>
</body>
</html>
